name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate delivery bundle against schema
        run: >
          npx --yes -p ajv-cli@5 -p ajv-formats@3 ajv validate --spec=draft2020
          -c ajv-formats
          -s schema/bundle.schema.json
          -r schema/rule.schema.json
          -d dist/rules.bundle.json

      - name: Authoring files stay consistent with dist bundle
        run: |
          jq -s 'add' rules/global.json rules/social.json rules/shopping.json | jq -S . > /tmp/authored.json
          jq -S '.rules' dist/rules.bundle.json > /tmp/dist.json
          diff -u /tmp/authored.json /tmp/dist.json

      # The prefix is the fixed DER header that wraps a raw 32-byte Ed25519 public key.
      - name: Signature verifies over the exact dist bytes
        run: |
          { printf '\x30\x2a\x30\x05\x06\x03\x2b\x65\x70\x03\x21\x00'; cat keys/dev_public.key; } > /tmp/public.der
          openssl pkeyutl -verify -pubin -keyform DER -inkey /tmp/public.der -rawin \
            -in dist/rules.bundle.json -sigfile dist/rules.bundle.json.sig

  # TODO(release): CI signing with a managed key replaces the locally signed, committed
  # dev-key signature at the release gate.
